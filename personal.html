<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography projects by Joshua Ngo.">
  <meta property="og:title" content="Portfolio — Joshua Ngo">
  <meta property="og:description" content="Selected photography projects by Joshua Ngo.">
  <meta property="og:type" content="website">
  <title>Portfolio — Joshua Ngo</title>
  <link rel="stylesheet" href="style.css?v=46">
  <link rel="stylesheet" href="portfolio.css?v=2">
  <script defer src="/site-interactions.js?v=1"></script>
</head>
<body class="personal-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="index.html" aria-label="Joshua Ngo, home"><span>Joshua</span><span>Ngo</span></a>
    <p class="header-note" aria-label="Visitor local time"><span id="localTime"></span></p>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu"><span></span><span></span></button>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="Site menu">
    <header class="menu-header"><button class="menu-close" id="menuClose" type="button" aria-label="Close menu"><span aria-hidden="true"></span><span aria-hidden="true"></span></button></header>
    <nav class="menu-nav" aria-label="Menu navigation">
      <a class="menu-primary" href="personal.html" aria-current="page">Portfolio</a>
      <a class="menu-primary" href="about.html">About</a>
    </nav>
    <footer class="menu-footer"><img class="instagram-mark" src="images/instagram.svg" alt="Instagram"></footer>
  </aside>

  <main class="gitti-portfolio" id="content" aria-label="Portfolio">
    <article class="gitti-project-card">
      <a href="gitti.html" aria-label="View Gitti photographic series">
        <img src="images/gitti/gitti-preview.jpg" alt="The Gitti facade glowing beneath a pink evening sky" width="1200" height="800" fetchpriority="high">
        <div class="gitti-project-caption"><h2>Gitti</h2></div>
      </a>
    </article>
    <article class="gitti-project-card">
      <a href="mokki.html" aria-label="View Mokki photographic series">
        <img src="images/mokki/mokki-preview.jpg" alt="A large paper pendant reflected in Mokki's communal table" width="1200" height="800" loading="lazy">
        <div class="gitti-project-caption"><h2>Mokki</h2></div>
      </a>
    </article>
  </main>

  <footer class="site-footer"><p class="footer-brand">© 2026 Joshua Ngo</p></footer>
  <a class="floating-top" id="floatingTop" href="#content" aria-label="Back to top"><span aria-hidden="true">↑</span></a>

  <script>
    const root = document.documentElement;
    const header = document.getElementById('siteHeader');
    const menuButton = document.getElementById('menuButton');
    const menuClose = document.getElementById('menuClose');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenu = document.getElementById('sideMenu');
    const floatingTop = document.getElementById('floatingTop');
    const localTime = document.getElementById('localTime');
    let ticking = false;

    function setMenu(open) {
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuBackdrop.setAttribute('aria-hidden', String(!open));
      if (open) menuClose.focus();
      else if (document.activeElement === menuClose) menuButton.focus();
    }

    function updateLocalDateTime() {
      localTime.textContent = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
    }

    function updateScroll() {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      root.style.setProperty('--progress', max > 0 ? y / max : 0);
      header.classList.toggle('is-compact', y > 40);
      floatingTop.classList.toggle('is-visible', y > window.innerHeight * .55);
      ticking = false;
    }

    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenu(false));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    sideMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setMenu(false); });
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(updateScroll); ticking = true; }
    }, { passive: true });
    updateLocalDateTime();
    window.setInterval(updateLocalDateTime, 1000);
    updateScroll();
  </script>
</body>
</html>
