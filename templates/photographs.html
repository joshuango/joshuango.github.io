<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{EXCERPT}}">
  <meta property="og:title" content="{{TITLE}} — Joshua Ngo">
  <meta property="og:description" content="{{EXCERPT}}">
  <meta property="og:type" content="article">
  
  <title>{{TITLE}} — Joshua Ngo</title>
  <link rel="stylesheet" href="style.css?v=46">
  <link rel="stylesheet" href="editorial.css?v=3">
  <style>
    body.editorial-project .article-masthead { padding: 36px var(--gutter) 32px; }
    body.editorial-project .article-masthead h1 { margin: 12px auto; font-size: clamp(32px, 4vw, 54px); }
    body.editorial-project .article-lead { display: flex; justify-content: center; max-width: 1100px; padding: 0 8vw; margin: 0 auto; }
    body.editorial-project .article-lead img { width: auto; height: auto; max-width: 100%; max-height: min(58svh, 620px); object-fit: contain; }
    body.editorial-project .portfolio-sequence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: clamp(96px, 14vw, 180px) clamp(36px, 7vw, 100px); max-width: 1120px; margin: 0 auto; padding: clamp(96px, 14vw, 180px) 7vw; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image { grid-column: auto; width: 100%; margin: 0; padding: 0; display: flex; justify-content: center; background: transparent; overflow: visible; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image img { display: block; width: auto; height: auto; max-width: 100%; max-height: min(62svh, 620px); object-fit: contain; }
    @media (max-width: 600px) {
      body.editorial-project .portfolio-sequence { grid-template-columns: 1fr; padding-inline: 9vw; gap: 90px; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image img { max-height: 66svh; }
      body.editorial-project .article-lead { padding-inline: 9vw; }
    }
  
    /* An authored sequence: balanced asymmetry, stable on every visit. */
    body.editorial-project .portfolio-sequence { grid-template-columns: repeat(12, minmax(0, 1fr)); max-width: 1240px; column-gap: clamp(18px, 3vw, 40px); }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(1) { grid-area: 1 / 1 / 2 / 4; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(2) { grid-area: 1 / 5 / 2 / 9; margin-top: 90px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(3) { grid-area: 1 / 10 / 2 / 13; margin-top: 25px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(4) { grid-area: 2 / 5 / 3 / 10; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(5) { grid-area: 3 / 1 / 4 / 5; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(6) { grid-area: 3 / 8 / 4 / 12; margin-top: 90px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(7) { grid-area: 4 / 2 / 5 / 5; margin-top: 90px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(8) { grid-area: 4 / 6 / 5 / 9; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(9) { grid-area: 4 / 10 / 5 / 13; margin-top: 60px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(10) { grid-area: 5 / 3 / 6 / 11; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(11) { grid-area: 6 / 2 / 7 / 6; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(12) { grid-area: 6 / 8 / 7 / 12; margin-top: 80px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(13) { grid-area: 7 / 6 / 8 / 10; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(3n) img { max-height: min(52svh, 520px); }
    @media (max-width: 600px) {
      body.editorial-project .portfolio-sequence { grid-template-columns: 1fr; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(n) { grid-area: auto; margin: 0; width: 92%; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(even) { width: 76%; margin-left: auto; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(3n) { width: 84%; margin-inline: auto; }
    }
  </style>
</head>
<body class="article-page editorial-page editorial-{{TYPE}}">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="index.html" aria-label="Joshua Ngo, home"><span>Joshua</span><span>Ngo</span></a>
    <p class="header-note" aria-label="Visitor local time"><span id="localTime"></span></p>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu"><span></span><span></span></button>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="Site menu">
    <header class="menu-header"><button class="menu-close" id="menuClose" type="button" aria-label="Close menu"><span aria-hidden="true"></span><span aria-hidden="true"></span></button></header>
    <nav class="menu-nav" aria-label="Menu navigation">
      <a class="menu-primary" href="personal.html">Portfolio</a>
      <a class="menu-primary" href="about.html">About</a>
    </nav>
    <footer class="menu-footer"><img class="instagram-mark" src="images/instagram.svg" alt="Instagram"></footer>
  </aside>

  <main class="article-main" id="content">
    <article>
      <header class="article-masthead">
        <h1>{{TITLE}}</h1>
      </header>

      <figure class="article-lead article-reveal">
        <img src="{{HERO}}" alt="{{HERO_ALT}}">
      </figure>


{{ARTICLE}}

{{QUOTE}}

{{GALLERY}}

{{RELATED}}

      <nav class="article-project-nav" aria-label="Project navigation">
        <a href="study.html"><strong>All Work</strong></a>
        <a href="#content"><strong>Back to top ↑</strong></a>
      </nav>
    </article>
  </main>

  <footer class="site-footer"><p class="footer-brand">© 2026 Joshua Ngo</p></footer>
  <a class="floating-top" id="floatingTop" href="#content" aria-label="Back to top"><span aria-hidden="true">↑</span></a>

  <script>
    const root = document.documentElement;
    const header = document.getElementById('siteHeader');
    const menuButton = document.getElementById('menuButton');
    const menuClose = document.getElementById('menuClose');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenu = document.getElementById('sideMenu');
    const floatingTop = document.getElementById('floatingTop');
    const localTime = document.getElementById('localTime');
    let ticking = false;

    function setMenu(open) {
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuBackdrop.setAttribute('aria-hidden', String(!open));
      if (open) menuClose.focus();
      else if (document.activeElement === menuClose) menuButton.focus();
    }

    function updateLocalDateTime() {
      localTime.textContent = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
    }

    function updateScroll() {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      root.style.setProperty('--progress', max > 0 ? y / max : 0);
      header.classList.toggle('is-compact', y > 40);
      floatingTop.classList.toggle('is-visible', y > window.innerHeight * .55);
      ticking = false;
    }

    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenu(false));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    sideMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setMenu(false); });
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal, .article-reveal').forEach((item) => revealObserver.observe(item));
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(updateScroll); ticking = true; }
    }, { passive: true });
    updateLocalDateTime();
    window.setInterval(updateLocalDateTime, 1000);
    updateScroll();
  </script>
</body>
</html>
