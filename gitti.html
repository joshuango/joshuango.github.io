    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(5) { grid-area: 3 / 1 / 4 / 5; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(6) { grid-area: 3 / 8 / 4 / 12; margin-top: 90px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(7) { grid-area: 4 / 2 / 5 / 5; margin-top: 90px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(8) { grid-area: 4 / 6 / 5 / 9; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(9) { grid-area: 4 / 10 / 5 / 13; margin-top: 60px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(10) { grid-area: 5 / 3 / 6 / 11; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(11) { grid-area: 6 / 2 / 7 / 6; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(12) { grid-area: 6 / 8 / 7 / 12; margin-top: 80px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(13) { grid-area: 7 / 6 / 8 / 10; margin-top: 0px; }
    body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(3n) img { max-height: min(52svh, 520px); }
    @media (max-width: 600px) {
      body.editorial-project .portfolio-sequence { grid-template-columns: 1fr; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(n) { grid-area: auto; margin: 0; width: 92%; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(even) { width: 76%; margin-left: auto; }
      body.editorial-project .portfolio-sequence .portfolio-sequence-image:nth-child(3n) { width: 84%; margin-inline: auto; }
    }
  
    .project-info { position: fixed; left: var(--gutter); bottom: calc(var(--project-info-bottom, 28px) + var(--project-info-lift, 0px)); z-index: 20; max-width: 300px; padding: 16px 18px; background: rgba(248,247,243,.55); -webkit-backdrop-filter: blur(14px) saturate(110%); backdrop-filter: blur(14px) saturate(110%); border: 1px solid rgba(255,255,255,.28); border-radius: 8px; box-shadow: 0 2px 12px rgba(23,23,20,.035); color: var(--ink); opacity: 0; visibility: hidden; transform: translateY(18px); transition: opacity .4s ease, transform .55s cubic-bezier(.22,1,.36,1), visibility .55s; }
    .project-info h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 21px; font-weight: 400; line-height: 1.2; }
    .project-info p { margin: 0; font-size: 11px; line-height: 1.7; }
    .project-info.is-visible { opacity: 1; visibility: visible; transform: translateY(0); }
    body.menu-open .project-info { opacity: 0; visibility: hidden; }
    @media (max-width: 600px) { .project-info { left: 20px; --project-info-bottom: 20px; max-width: calc(100vw - 70px); padding: 12px 14px; } .project-info h2 { font-size: 18px; } .project-info p { font-size: 10px; } }
    @media (prefers-reduced-motion: reduce) { .project-info { transition: none; transform: none; } }
  </style>

<body class="article-page editorial-page editorial-project">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="index.html" aria-label="Joshua Ngo, home"><span>Joshua</span><span>Ngo</span></a>
    <p class="header-note" aria-label="Visitor local time"><span id="localTime"></span></p>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu"><span></span><span></span></button>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="Site menu">
    <header class="menu-header"><button class="menu-close" id="menuClose" type="button" aria-label="Close menu"><span aria-hidden="true"></span><span aria-hidden="true"></span></button></header>
    <nav class="menu-nav" aria-label="Menu navigation">
      <a class="menu-primary" href="personal.html">Portfolio</a>
      <a class="menu-primary" href="about.html">About</a>
    </nav>
    <footer class="menu-footer"><img class="instagram-mark" src="images/instagram.svg" alt="Instagram"></footer>
  </aside>

  <main class="article-main" id="content">
    <article>

      <figure class="article-lead article-reveal">
        <img src="images/gitti/dscf1916.jpg" alt="Gitti exterior with concrete walls, a dark roof and a passing car">
      </figure>


<div class="editorial-body"></div>



      <div class="portfolio-sequence" aria-label="Project photographs">
        <figure class="portfolio-sequence-image portfolio-sequence-image-0 article-reveal"><img src="images/gitti/dscf2121.jpg" alt="A paper pendant above a low table in a sunlit timber sitting room" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-1 article-reveal"><img src="images/gitti/dscf1824.jpg" alt="A timber walkway between concrete walls beneath an open sky" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-2 article-reveal"><img src="images/gitti/dscf2723.jpg" alt="A white robe against a timber wall above a dark stone floor" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-0 article-reveal"><img src="images/gitti/dscf2678.jpg" alt="A courtyard tree and stone wall seen through a timber-framed bedroom window" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-1 article-reveal"><img src="images/gitti/dscf1693.jpg" alt="Sunlight through a dark pergola over a timber courtyard deck" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-2 article-reveal"><img src="images/gitti/dscf2740-2.jpg" alt="A timber kitchen and low sitting area beneath a large paper pendant" loading="lazy" decoding="async"></figure>

        <figure class="portfolio-sequence-image portfolio-sequence-image-1 article-reveal"><img src="images/gitti/dscf2701.jpg" alt="A concrete courtyard with a timber deck and planted gravel garden" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-2 article-reveal"><img src="images/gitti/dscf2174.jpg" alt="Afternoon sunlight across a white sofa beneath a paper pendant" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-0 article-reveal"><img src="images/gitti/dscf2035.jpg" alt="The Gitti facade glowing beneath a pink evening sky" loading="lazy" decoding="async"></figure>
        <figure class="portfolio-sequence-image portfolio-sequence-image-1 article-reveal"><img src="images/gitti/dscf1688.jpg" alt="A timber corridor beside white curtains and a stone threshold" loading="lazy" decoding="async"></figure>

  <aside class="project-info" id="projectInfo" aria-label="Project details" aria-hidden="true">

    <p>For Softer Volumes: South Korea Guide</p>
    <p>2025</p>
  </aside>

  <footer class="site-footer"><p class="footer-brand">© 2026 Joshua Ngo</p></footer>
  <a class="floating-top" id="floatingTop" href="#content" aria-label="Back to top"><span aria-hidden="true">↑</span></a>

  <script>
    const root = document.documentElement;
    const header = document.getElementById('siteHeader');
    const menuButton = document.getElementById('menuButton');
    const menuClose = document.getElementById('menuClose');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenu = document.getElementById('sideMenu');
    const floatingTop = document.getElementById('floatingTop');
    const localTime = document.getElementById('localTime');
    const projectInfo = document.getElementById('projectInfo');
    const projectLead = document.querySelector('.article-lead img');
    const projectImages = Array.from(document.querySelectorAll('.article-lead img, .portfolio-sequence img'));
    const lastProjectImage = projectImages.at(-1);
    let ticking = false;

    function setMenu(open) {
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuBackdrop.setAttribute('aria-hidden', String(!open));
      if (open) menuClose.focus();
      else if (document.activeElement === menuClose) menuButton.focus();
    }

    function updateLocalDateTime() {
      localTime.textContent = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
    }

    function updateScroll() {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      root.style.setProperty('--progress', max > 0 ? y / max : 0);
      header.classList.toggle('is-compact', y > 40);
      floatingTop.classList.toggle('is-visible', y > window.innerHeight * .55);
      if (projectInfo) {
        const bottomInset = parseFloat(getComputedStyle(projectInfo).getPropertyValue('--project-info-bottom')) || 28;
        const lift = lastProjectImage
          ? Math.max(0, window.innerHeight - bottomInset - lastProjectImage.getBoundingClientRect().bottom)
          : 0;
        projectInfo.style.setProperty('--project-info-lift', lift + 'px');
        const showInfo = Boolean(projectLead && projectLead.getBoundingClientRect().top <= 0);
        projectInfo.classList.toggle('is-visible', showInfo);
        projectInfo.setAttribute('aria-hidden', String(!showInfo));
      }
      ticking = false;
    }

    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenu(false));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    sideMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setMenu(false); });
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal, .article-reveal').forEach((item) => revealObserver.observe(item));
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(updateScroll); ticking = true; }
    }, { passive: true });
    projectImages.forEach((image) => image.addEventListener('load', updateScroll));
    window.addEventListener('resize', updateScroll, { passive: true });
    updateLocalDateTime();
    window.setInterval(updateLocalDateTime, 1000);
    updateScroll();
  </script>
</body>
